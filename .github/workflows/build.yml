name: build plugins

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B plugin/build -S plugin -A x64 -DADDSYNTH_COPY_PLUGIN=OFF

      - name: build
        run: cmake --build plugin/build --config Release --target AddSynth_VST3 AddSynth_Standalone AddSynthV2_VST3 AddSynthV2_Standalone partials_test model_controls_test audio_import_test

      - name: test sine lab
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "plugin/build/AddSynth_artefacts/Release/VST3/AddSynth Sine Lab.vst3" dist/
          Copy-Item "plugin/build/AddSynth_artefacts/Release/Standalone/AddSynth Sine Lab.exe" dist/
          Copy-Item -Recurse "plugin/build/AddSynthV2_artefacts/Release/VST3/AddSynth Sine Lab 2.vst3" dist/
          Copy-Item "plugin/build/AddSynthV2_artefacts/Release/Standalone/AddSynth Sine Lab 2.exe" dist/
          if (Test-Path models) { Copy-Item -Recurse models dist/ }
          @"
          AddSynth Sine Lab (Windows)
          ==================
          Two plugins are included: "AddSynth Sine Lab 2" (new editor, audio
          import, per-model playback / envelope / partials) and the original
          "AddSynth Sine Lab". They can be installed side by side.
          1. Copy the .vst3 FOLDERS into:
             C:\Program Files\Common Files\VST3\
          2. Rescan plugins in your DAW (Ableton: Options > Preferences >
             Plug-Ins > Rescan). Find them under Algorytmid.
          The .exe files run standalone without a DAW (pick your audio/MIDI
          device in the options button).
          Sine Lab 2: drop audio onto the XY pad or click "add sounds...".
          Sine Lab: click "add models..." and load .addm model files.
          "@ | Set-Content dist/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AddSynth-Sine-Lab-Windows
          path: dist/

      - name: zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath AddSynth-Sine-Lab-Windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AddSynth-Sine-Lab-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B plugin/build -S plugin -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DADDSYNTH_COPY_PLUGIN=OFF

      - name: build
        run: cmake --build plugin/build --config Release --target AddSynth_VST3 AddSynth_AU AddSynth_Standalone AddSynthV2_VST3 AddSynthV2_AU AddSynthV2_Standalone partials_test model_controls_test audio_import_test -j3

      - name: test sine lab
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      - name: package
        run: |
          mkdir -p dist
          cp -R "plugin/build/AddSynth_artefacts/Release/VST3/AddSynth Sine Lab.vst3" dist/
          cp -R "plugin/build/AddSynth_artefacts/Release/AU/AddSynth Sine Lab.component" dist/
          cp -R "plugin/build/AddSynth_artefacts/Release/Standalone/AddSynth Sine Lab.app" dist/
          cp -R "plugin/build/AddSynthV2_artefacts/Release/VST3/AddSynth Sine Lab 2.vst3" dist/
          cp -R "plugin/build/AddSynthV2_artefacts/Release/AU/AddSynth Sine Lab 2.component" dist/
          cp -R "plugin/build/AddSynthV2_artefacts/Release/Standalone/AddSynth Sine Lab 2.app" dist/
          [ -d models ] && cp -R models dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: AddSynth-Sine-Lab-macOS
          path: dist/

      - name: zip
        if: startsWith(github.ref, 'refs/tags/')
        run: ditto -c -k --keepParent dist AddSynth-Sine-Lab-macOS.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AddSynth-Sine-Lab-macOS.zip
